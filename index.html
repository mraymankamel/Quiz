const EMAILJS_SERVICE_ID = "service_uu1lnnq";
const EMAILJS_PUBLIC_KEY = "KUgWaj4LYP2IAcRuZ";

(function(){ if (typeof emailjs !== 'undefined') emailjs.init(EMAILJS_PUBLIC_KEY); })();

let audioCtx = null, bgmOsc = null, bgmGain = null, isMusicPlaying = false;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, type, duration) {
    try {
        initAudio();
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = type; osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch(e){}
}
function soundClick() { playTone(450, 'sine', 0.1); }
function soundWrongTime() { playTone(150, 'sawtooth', 0.4); setTimeout(()=>playTone(120, 'sawtooth', 0.4), 200); }
function soundBossWin() { [523, 659, 783, 1046].forEach((f,i)=> setTimeout(()=>playTone(f,'square',0.2), i*150)); }
function soundEasterEgg() { [440, 554, 659, 880, 1108].forEach((f,i)=> setTimeout(()=>playTone(f,'triangle',0.15), i*100)); }
function soundPortal() {
    try {
        initAudio();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.25);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
    } catch(e){}
}

function toggleMusic() {
    initAudio();
    if (isMusicPlaying) {
        if (bgmGain) bgmGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5);
        setTimeout(() => { if(bgmOsc) { bgmOsc.stop(); bgmOsc.disconnect(); } }, 500);
        isMusicPlaying = false;
    } else {
        bgmOsc = audioCtx.createOscillator(); bgmGain = audioCtx.createGain();
        bgmOsc.type = 'sine'; bgmOsc.frequency.value = 150; 
        let lfo = audioCtx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.2;
        let lfoGain = audioCtx.createGain(); lfoGain.gain.value = 50;
        lfo.connect(lfoGain); lfoGain.connect(bgmOsc.frequency);
        lfo.start();
        bgmGain.gain.setValueAtTime(0, audioCtx.currentTime);
        bgmGain.gain.setTargetAtTime(0.03, audioCtx.currentTime, 2);
        bgmOsc.connect(bgmGain); bgmGain.connect(audioCtx.destination);
        bgmOsc.start();
        isMusicPlaying = true;
    }
}

const qBox = document.getElementById('q-box');
qBox.addEventListener('mousemove', (e) => {
    const rect = qBox.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const centerX = rect.width / 2, centerY = rect.height / 2;
    const rotateX = ((y - centerY) / centerY) * -8; 
    const rotateY = ((x - centerX) / centerX) * 8;
    qBox.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
    qBox.classList.add('active-tilt');
});
qBox.addEventListener('mouseleave', () => {
    qBox.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
    qBox.classList.remove('active-tilt');
});
window.addEventListener('deviceorientation', (e) => {
    if(!e.beta || !e.gamma) return;
    let rotateX = Math.max(-10, Math.min(10, e.beta - 45)); 
    let rotateY = Math.max(-10, Math.min(10, e.gamma));
    qBox.style.transform = `perspective(1000px) rotateX(${-rotateX}deg) rotateY(${rotateY}deg)`;
});

function initScratchCard() {
    const container = document.getElementById("badge-award-box");
    const canvas = document.getElementById("scratch-canvas");
    const ctx = canvas.getContext("2d");
    
    canvas.width = container.offsetWidth;
    canvas.height = container.offsetHeight;
    
    ctx.fillStyle = "#cbd5e1"; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.font = "bold 16px 'Readex Pro', sans-serif";
    ctx.fillStyle = "#334155";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("🪄 اخدش هنا لكشف وسامك!", canvas.width/2, canvas.height/2);
    
    let isDrawing = false;
    function scratch(e) {
        if(!isDrawing) return;
        e.preventDefault();
        let rect = canvas.getBoundingClientRect();
        let x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        let y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
        
        ctx.globalCompositeOperation = "destination-out";
        ctx.beginPath();
        ctx.arc(x, y, 18, 0, Math.PI*2);
        ctx.fill();
    }
    
    canvas.onmousedown = () => isDrawing = true;
    canvas.ontouchstart = () => isDrawing = true;
    canvas.onmouseup = () => isDrawing = false;
    canvas.ontouchend = () => isDrawing = false;
    canvas.onmousemove = scratch;
    canvas.ontouchmove = scratch;
}

        item.q = `${index + 1}. ` + item.q.split(". ")[1]; 
        let correctText = item.options[item.answer];
        item.options.sort(() => Math.random() - 0.5); 
        item.answer = item.options.indexOf(correctText);
    });
    return clone;
}

function selectAvatar(el, avatar) {
    document.querySelectorAll('.avatar-option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    selectedAvatar = avatar;
    soundClick();
}

function toggleTimerView() { document.getElementById("timer-text").classList.toggle("hidden-timer"); soundClick(); }

function spawnParticles(e) {
    const x = e.clientX, y = e.clientY;
    for(let i=0; i<6; i++) {
        let p = document.createElement('div');
        p.className = 'click-particle';
        p.innerText = '✨';
        p.style.left = x + 'px'; p.style.top = y + 'px';
        p.style.setProperty('--dx', (Math.random() * 100 - 50) + 'px');
        p.style.setProperty('--dy', (Math.random() * 100 - 50) + 'px');
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 600);
    }
}

function startQuiz() {
    const input = document.getElementById("studentName").value.trim();
    if (!input) { alert("من فضلك اكتب اسمك يا بطل!"); return; }
    studentName = input;
    quizData = shuffleQuiz(); 
    
    soundClick();
    document.getElementById("start-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    document.getElementById("timer-container").style.display = "flex";
    document.getElementById("player-badge").innerText = `${selectedAvatar} ${studentName}`;
    document.getElementById("running-avatar").innerText = selectedAvatar;
    
    startTimer();
    loadQuestion();
}

function updateWorldTheme() {
    let container = document.getElementById("app-container");
    container.className = "main-container"; 
    if(currentQuestion < 10) container.classList.add("theme-forest");
    else if(currentQuestion < 20) container.classList.add("theme-ice");
    else if(currentQuestion < 30) container.classList.add("theme-space");
    else if(currentQuestion < 40) container.classList.add("theme-desert");
    else container.classList.add("theme-volcano");
}

function triggerPortalTransition(callback) {
    soundPortal();
    const portal = document.getElementById("portal-overlay");
    portal.classList.add("active");
    setTimeout(() => {
        callback();
        portal.classList.remove("active");
    }, 600);
}

function loadQuestion() {
    updateWorldTheme();
    
    if(isTimeAttack) {
        qTimeLeft = 15; 
        document.getElementById("timer-box").classList.remove("danger");
    }

    const item = quizData[currentQuestion];
    document.getElementById("question-text").innerText = item.q;

    const optionsList = document.getElementById("options-list");
    optionsList.innerHTML = "";

    item.options.forEach((opt, oIndex) => {
        const div = document.createElement("div");
        div.className = "option-item";
        if (userAnswers[currentQuestion] === oIndex) div.classList.add("selected");
        div.innerHTML = `<span style="direction: ltr; display: inline-block;"><b>${String.fromCharCode(65 + oIndex)}.</b> ${opt}</span>`;
        div.onclick = (e) => selectOption(oIndex, e);
        optionsList.appendChild(div);
    });

    const total = quizData.length;
    const progressPercent = Math.round(((currentQuestion + 1) / total) * 100);
    document.getElementById("progress-count").innerText = `السؤال ${currentQuestion + 1} من ${total}`;
    document.getElementById("energy-bar").style.width = `${progressPercent}%`;
    document.getElementById("running-avatar").style.left = `${progressPercent}%`;

    document.getElementById("prev-btn").disabled = currentQuestion === 0;
    if(isTimeAttack) document.getElementById("prev-btn").style.display = "none";

    document.getElementById("next-btn").style.display = (currentQuestion === total - 1) ? "none" : "inline-flex";
    document.getElementById("submit-btn").style.display = (currentQuestion === total - 1) ? "inline-flex" : "none";
}

function selectOption(oIndex, e) {
    soundClick();
    spawnParticles(e);
    userAnswers[currentQuestion] = oIndex;
    loadQuestion();
}

function nextQuestion(force = false) {
    if (!force && userAnswers[currentQuestion] === undefined) { alert("اختر إجابة أولاً يا بطل!"); return; }
    soundClick();
    if (currentQuestion < quizData.length - 1) { 
        if ((currentQuestion + 1) % 10 === 0 && !isTimeAttack) {
            triggerPortalTransition(() => {
                currentQuestion++;
                loadQuestion();
                triggerTeacherCheer();
            });
        } else {
            currentQuestion++; 
            loadQuestion();
            if ([14, 24, 34, 44].includes(currentQuestion) && !isTimeAttack) triggerTeacherCheer();
        }
    }
}

function prevQuestion() { soundClick(); if (currentQuestion > 0) { currentQuestion--; loadQuestion(); } }

function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        if(isTimeAttack) {
            qTimeLeft--;
            document.getElementById("timer-text").innerText = `00:${qTimeLeft<10?'0'+qTimeLeft:qTimeLeft}`;
            if (qTimeLeft <= 5) document.getElementById("timer-box").classList.add("danger");
            if (qTimeLeft <= 0) {
                soundWrongTime();
                userAnswers[currentQuestion] = -1; 
                if(currentQuestion < quizData.length - 1) nextQuestion(true);
                else calculateScore();
            }
        } else {
            totalSeconds--;
            let m = Math.floor(totalSeconds / 60), s = totalSeconds % 60;
            document.getElementById("timer-text").innerText = `${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
            if (totalSeconds <= 300) document.getElementById("timer-box").classList.add("danger");
            if (totalSeconds <= 0) { clearInterval(timerInterval); calculateScore(); }
        }
    }, 1000);
}

function confirmSubmit() {
    if(isTimeAttack) { calculateScore(); return; } 
    let un = quizData.filter((_, i) => userAnswers[i] === undefined).length;
    if (un > 0) { if(confirm(`⚠️ تركت ${un} سؤال بدون إجابة! هل تريد التسليم؟`)) calculateScore(); } 
    else calculateScore();
}

function calculateScore() {
    clearInterval(timerInterval);
    soundBossWin();

    let score = 0;
    const reviewList = document.getElementById("review-list");
    reviewList.innerHTML = "";

    quizData.forEach((item, index) => {
        const isCorrect = userAnswers[index] === item.answer;
        if (isCorrect) score++;
        
        let userOptText = "لم يتم الحل ❌";
        if (userAnswers[index] !== undefined && userAnswers[index] !== -1) {
            userOptText = item.options[userAnswers[index]];
        }
        const correctOpt = item.options[item.answer];

        const div = document.createElement("div");
        div.className = `review-item ${isCorrect ? 'is-correct' : 'is-wrong'}`;
        div.innerHTML = `<div style="font-weight:800;font-size:17px;margin-bottom:8px; direction: ltr;">${item.q}</div>
            <div style="direction: rtl;">إجابتك: <b style="color:${isCorrect?'#10b981':'#f43f5e'}; direction: ltr; display: inline-block;">${userOptText}</b></div>
            ${!isCorrect ? `<div style="color:#10b981;font-weight:800;margin-top:4px; direction: rtl;">الإجابة الصحيحة: <span style="direction: ltr; display: inline-block;">${correctOpt}</span></div>` : ''}
            <div class="explanation-box">${item.exp}</div>`;
        reviewList.appendChild(div);
    });

    const percent = Math.round((score / quizData.length) * 100);
    window.finalScore = score; window.finalPercent = percent;

    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("timer-container").style.display = "none";
    document.getElementById("app-container").className = "main-container"; 
    
    let displayAv = isMaxPower ? "🌟" : selectedAvatar;
    document.getElementById("student-display-name").innerText = `${displayAv} البطل / ${studentName}`;
    document.getElementById("score-percentage").innerText = `${percent}%`;
    
    let modTxt = isTimeAttack ? " (وضع الموت المفاجئ 🔥)" : "";
    document.getElementById("score-details").innerText = `حصلت على ${score} من 50${modTxt}`;

    let badge = percent >= 90 ? "🏆 قاهر المضارع البسيط" : percent >= 75 ? "⭐ بطل الإنجليزي الممتاز" : "💡 بطل محارب استمر!";
    if(isMaxPower) badge = "👑 أسطورة القوة القصوى 👑";
    document.getElementById("badge-award-box").innerText = badge;
    
    if (percent >= 85) {
        document.getElementById("cert-btn").style.display = "inline-flex";
    }
    
    document.getElementById("result-screen").style.display = "block";
    window.scrollTo({ top: 0, behavior: 'smooth' });

    setTimeout(() => initScratchCard(), 100);

    if(typeof emailjs !== 'undefined') {
        emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
            quiz_name: "Present Simple Ultimate",
            student_name: `${selectedAvatar} ${studentName}`, 
            score: `${score}/50`, 
            percentage: `${percent}%`, 
            date_time: new Date().toLocaleString('ar-EG')
        });
    }
    if (percent >= 80 && typeof confetti === 'function') confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
}

function shareToWhatsApp() {
    let mode = isTimeAttack ? " (وضع الموت المفاجئ 🔥)" : "";
    let txt = `📚 Present Simple Ultimate\n👤 البطل: ${selectedAvatar} ${studentName}\n📊 النتيجة: ${finalScore}/50 (${finalPercent}%)${mode}\n✨ شكراً لك يا مستر أيمن! 🚀`;
    window.open(`https://wa.me/201284749899?text=${encodeURIComponent(txt)}`, '_blank');
}

function downloadCertificate() {
    const canvas = document.createElement('canvas');
    canvas.width = 1000;
    canvas.height = 700;
    const ctx = canvas.getContext('2d');

    const grd = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    grd.addColorStop(0, "#1e1b4b"); 
    grd.addColorStop(1, "#312e81");
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "#facc15";
    ctx.lineWidth = 15;
    ctx.strokeRect(30, 30, canvas.width - 60, canvas.height - 60);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);

    ctx.textAlign = "center";
    ctx.fillStyle = "#facc15";
    ctx.font = "bold 50px Arial, sans-serif";
    ctx.fillText("⭐ Certificate of Excellence ⭐", canvas.width / 2, 120);

    ctx.fillStyle = "#ffffff";
    ctx.font = "30px Arial, sans-serif";
    ctx.fillText("This is proudly presented to the brilliant hero:", canvas.width / 2, 220);

    ctx.fillStyle = "#facc15";
    ctx.font = "bold 60px Arial, sans-serif";
    let displayAv = isMaxPower ? "🌟" : selectedAvatar;
    ctx.fillText(displayAv + " " + studentName, canvas.width / 2, 320);

    ctx.fillStyle = "#ffffff";
    ctx.font = "25px Arial, sans-serif";
    ctx.fillText("For mastering the Present Simple Tense with a phenomenal score of", canvas.width / 2, 420);

    ctx.fillStyle = "#10b981"; 
    ctx.font = "bold 55px Arial, sans-serif";
    ctx.fillText(`${finalScore} / 50  (${finalPercent}%)`, canvas.width / 2, 500);

    ctx.fillStyle = "#cbd5e1";
    ctx.font = "22px Arial, sans-serif";
    ctx.fillText("Mr. Ayman Kamel - English Language Educator", canvas.width / 2, 600);
    
    let dateObj = new Date();
    let dateString = dateObj.toLocaleDateString('en-GB');
    ctx.font = "18px Arial, sans-serif";
    ctx.fillText("Date: " + dateString, canvas.width / 2, 640);

    const link = document.createElement('a');
    link.download = `Certificate_${studentName}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
}
</script>
